{% extends "base.html" %}
{% block home %}/admin{% endblock %}
{% block menu %}
  {% if user %}
  <div class="who"><strong>{{ user.display_name }}</strong><small>{{ ROLE_LABEL[user.role] }}</small></div>
  <a href="/admin">Wahlen</a>
  <a href="/admin/account">Mein Konto</a>
  {% if user.role == 'admin' %}
  <a href="/admin/settings">Einstellungen</a>
  <a href="/admin/users">Benutzer</a>
  <a href="/admin/audit">Protokoll</a>
  {% endif %}
  <a href="/">Zur Wahlseite</a>
  <form method="post" action="/admin/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf(request) }}">
    <button class="out" type="submit">Abmelden</button>
  </form>
  {% else %}
  <a href="/">Zur Wahl</a>
  {% endif %}
{% endblock %}

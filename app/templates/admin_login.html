{% extends "admin_base.html" %}
{% block title %}Anmelden{% endblock %}
{% block mainclass %}narrow{% endblock %}
{% block content %}
<section class="card">
  <h1>Backoffice</h1>
  {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <input type="hidden" name="csrf_token" value="{{ csrf(request) }}">
    <label for="username">Benutzername</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Passwort</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary big" type="submit">Anmelden</button>
  </form>
</section>
{% endblock %}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: schulwahl
      POSTGRES_USER: schulwahl
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Bitte DB_PASSWORD in der .env setzen}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schulwahl -d schulwahl"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s  # erste Initialisierung auf einem Raspberry Pi mit SD-Karte dauert länger

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: schulwahl
      POSTGRES_USER: schulwahl
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Bitte ADMIN_PASSWORD in der .env setzen}
      SECRET_KEY: ${SECRET_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SCHOOL_NAME: ${SCHOOL_NAME:-Unsere Schule}
      TZ: ${TZ:-Europe/Vienna}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    # Härtung: unveränderliches Dateisystem, keine Zusatzrechte
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    ports:
      # Im HTTPS-Betrieb setzt setup.sh APP_BIND=127.0.0.1, dann ist nur Caddy von außen erreichbar.
      - "${APP_BIND:-0.0.0.0}:${PORT:-8080}:8000"

  # Optional: HTTPS-Proxy (wird von setup.sh bei Bedarf mitgestartet)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:

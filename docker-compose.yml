services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: schulwahl
      POSTGRES_USER: schulwahl
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Bitte DB_PASSWORD in der .env setzen}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schulwahl -d schulwahl"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: schulwahl
      POSTGRES_USER: schulwahl
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Bitte ADMIN_PASSWORD in der .env setzen}
      SECRET_KEY: ${SECRET_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SCHOOL_NAME: ${SCHOOL_NAME:-Unsere Schule}
      TZ: ${TZ:-Europe/Vienna}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    ports:
      - "${PORT:-8080}:8000"

  # Optional: HTTPS-Proxy. Start mit:  docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:

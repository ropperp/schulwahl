name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schulwahl
          POSTGRES_PASSWORD: test
          POSTGRES_DB: schulwahl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U schulwahl" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests mit SQLite
        run: python -m pytest -q
        env:
          ADMIN_PASSWORD: test
      - name: Tests mit PostgreSQL
        run: python -m pytest -q
        env:
          ADMIN_PASSWORD: test
          TEST_DATABASE_URL: postgresql+psycopg://schulwahl:test@localhost:5432/schulwahl_test
      - name: Bekannte Schwachstellen in Abhängigkeiten
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Shell-Skripte prüfen
        run: for f in setup.sh scripts/backup.sh scripts/restore.sh; do bash -n "$f"; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t schulwahl-app .
